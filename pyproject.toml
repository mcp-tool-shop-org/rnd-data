[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rnd-data"
dynamic = ["version"]
description = "Read-only reader and schema validator for the rnd-data research store."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE-MIT"]
authors = [{ name = "mcp-tool-shop", email = "64996768+mcp-tool-shop@users.noreply.github.com" }]
keywords = ["research", "reproducibility", "manifests", "sha256", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "coverage>=7.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "setuptools>=77",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://mcp-tool-shop-org.github.io/rnd-data/"
Repository = "https://github.com/mcp-tool-shop-org/rnd-data"
Changelog = "https://github.com/mcp-tool-shop-org/rnd-data/blob/main/CHANGELOG.md"
Issues = "https://github.com/mcp-tool-shop-org/rnd-data/issues"

[project.scripts]
rnd-data = "rnd_data.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["rnd_data*"]

[tool.setuptools.package-data]
rnd_data = ["schemas/*.json"]

[tool.setuptools.dynamic]
version = { attr = "rnd_data.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["rnd_data"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
