name: Release

# Publishes rnd-data to PyPI when a GitHub release is published.
# Trusted publishing (OIDC): PyPI trusts this repo (mcp-tool-shop-org/rnd-data),
# this workflow file name (release.yml), and the `pypi` environment, so no token
# is stored.
#
# Standards compliance:
# - PIN_PER_STEP: actions and build tools (build, twine, pytest, ruff) and rnd
#   are pinned by SHA or exact version.
# - ANDON_AUTHORITY: tag validation, verify.sh, ruff, pytest (--cov-fail-under=90),
#   version-matches-tag check, and twine check --strict must all pass before
#   publishing.
# - NAMED_COMPENSATORS / Compensator: a PyPI upload cannot be deleted and re-used.
#   If a release is wrong, yank it on pypi.org (Manage -> Releases -> Yank), fix,
#   and publish the next patch version. Owner: the Director.
# - DECOMPOSE_BY_SECRETS: the `verify` job runs with `contents: read` only;
#   `permissions: id-token: write` and `environment: pypi` are granted on the
#   `pypi` publish job only. Release workflows trigger on release (and manual
#   workflow_dispatch) only, so they do not count toward the two push-triggered
#   workflows.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "an existing release tag to publish, e.g. v0.1.0"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: The tag is a released version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a version tag: $TAG"; exit 1; }
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft) || { echo "no GitHub release for $TAG"; exit 1; }
          test "$draft" = "false" || { echo "the release for $TAG is a draft"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install rnd (pinned to a commit, same as ci.yml)
        run: python -m pip install "git+https://github.com/mcp-tool-shop-org/rnd@77978647b10b191a15490826860592da8f436961"  # rnd 1.1.22.0.0, tag v1.1.22.0.0

      - name: Verify store manifests (verify.sh)
        run: bash verify.sh

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Test with coverage
        run: pytest --cov=rnd_data --cov-report=term-missing --cov-fail-under=90

      - name: Version matches the tag
        run: |
          v=$(python -c "import rnd_data; print(rnd_data.__version__)")
          test "v$v" = "$TAG" || { echo "tag $TAG != package v$v"; exit 1; }

  pypi:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write  # PyPI trusted publishing (publish job only)
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: The tag is a released version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a version tag: $TAG"; exit 1; }
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft) || { echo "no GitHub release for $TAG"; exit 1; }
          test "$draft" = "false" || { echo "the release for $TAG is a draft"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Version matches the tag
        run: |
          v=$(PYTHONPATH=src python -c "import rnd_data; print(rnd_data.__version__)")
          test "v$v" = "$TAG" || { echo "tag $TAG != package v$v"; exit 1; }

      - name: Build and check
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build
          python -m twine check --strict dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
